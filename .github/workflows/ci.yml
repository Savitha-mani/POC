name: Multi-Browser Selenium CI

on:
  push:
    # Trigger on main AND any branch starting with 'feature/'
    branches: [ main, 'feature/*' ]
  pull_request:
    branches: [ main ]

jobs:
  automation-tests:

    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 1. Install Chrome (Standard for Ubuntu Runners)
      - name: Setup Chrome
        run: sudo apt-get update && sudo apt-get install google-chrome-stable

      # 2. Install Firefox specifically
      - name: Setup Firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: 'latest'

      # 3. Run all tests defined in your testng.xml
      - name: Run Multi-Browser Tests
        run: mvn clean test -DsuiteXmlFile=testng.xml

      # 4. Collect Artifacts (Even if tests fail)s
      - name: Upload Extent Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-Test-Reports
          path: reports/index.html # Ensure this matches your ExtentReport path
          retention-days: 5